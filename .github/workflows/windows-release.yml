name: Windows installer and public alpha release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Standalone EXE
        run: python -m PyInstaller --noconfirm --clean LakaPDF.spec
      - name: EXE smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\LakaPDF\LakaPDF.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "EXE smoke test failed: $($proc.ExitCode)" }
      - name: Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer\LakaPDF.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
          if (!(Test-Path 'release\LakaPDF_0.3.1_Windows_x64_Setup.exe')) { throw 'EXE missing' }
      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash 'release\LakaPDF_0.3.1_Windows_x64_Setup.exe' -Algorithm SHA256 | Format-List | Out-File 'release\SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: LakaPDF-Windows-Installer
          path: |
            release/LakaPDF_0.3.1_Windows_x64_Setup.exe
            release/SHA256.txt
          if-no-files-found: error
      - name: Public pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1-alpha
          target_commitish: main
          name: LakaPDF Alpha 0.3.1 Windows
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: |
            release/LakaPDF_0.3.1_Windows_x64_Setup.exe
            release/SHA256.txt
