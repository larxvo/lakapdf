name: Windows build and install smoke tests (unsigned)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Standalone EXE
        run: python -m PyInstaller --noconfirm --clean LakaPDF.spec
      - name: EXE smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\LakaPDF\LakaPDF.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "EXE smoke test failed: $($proc.ExitCode)" }
      - name: Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer\LakaPDF.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
          if (!(Test-Path 'release\LakaPDF_0.3.1_Windows_x64_Setup.exe')) { throw 'EXE missing' }
      - name: Verify silent installation and uninstall
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'release\LakaPDF_0.3.1_Windows_x64_Setup.exe').Path
          $installed = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Install failure: $($installed.ExitCode)" }
          $program = Join-Path $env:LOCALAPPDATA 'Programs\LakaPDF\LakaPDF.exe'
          if (!(Test-Path $program)) { throw 'Installed LakaPDF.exe missing' }
          $check = Start-Process -FilePath $program -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Installed app test failure: $($check.ExitCode)" }
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\LakaPDF\unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $removed = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Uninstall failure: $($removed.ExitCode)" }
      - name: Explain unsigned build status
        shell: pwsh
        run: |
          Write-Host 'UNSIGNED TEST ARTIFACT ONLY — NOT A TRUSTED PUBLIC RELEASE'
          Write-Host 'Production distribution requires the separate signed-release workflow.'
      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash 'release\LakaPDF_0.3.1_Windows_x64_Setup.exe' -Algorithm SHA256 | Format-List | Out-File 'release\SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: LakaPDF-Windows-Installer
          path: |
            release/LakaPDF_0.3.1_Windows_x64_Setup.exe
            release/SHA256.txt
          if-no-files-found: error
